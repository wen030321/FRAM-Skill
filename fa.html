<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>護理 FRAM × AI 情境設計模型</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d8dee9;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --teal: #0f766e;
      --amber: #b45309;
      --red: #b42318;
      --green: #047857;
      --shadow: 0 14px 30px rgba(31, 41, 55, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(37, 99, 235, 0.08), transparent 320px),
        var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }
    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }
    header {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .version {
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 14px;
    }
    .fram-map {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
      padding: 18px;
      min-height: 238px;
    }
    .fram-map::before,
    .fram-map::after {
      content: "";
      position: absolute;
      background: #bfd0ea;
      z-index: 0;
    }
    .fram-map::before {
      left: 22%;
      right: 22%;
      top: 50%;
      height: 2px;
    }
    .fram-map::after {
      top: 20%;
      bottom: 20%;
      left: 50%;
      width: 2px;
    }
