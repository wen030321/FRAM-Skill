<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>護理 FRAM × AI 情境設計模型</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d8dee9;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --teal: #0f766e;
      --amber: #b45309;
      --red: #b42318;
      --green: #047857;
      --shadow: 0 14px 30px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(37, 99, 235, 0.08), transparent 320px),
        var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    header {
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .version {
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 14px;
    }

    .fram-map {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      min-height: 150px;
    }

    .node {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 56px;
      background: #fbfdff;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
    }

    .node.core {
      background: #e0f2fe;
      border-color: #93c5fd;
      color: #1e3a8a;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-top: 18px;
      overflow: hidden;
    }

    .section-title {
      margin: 0;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      font-size: 20px;
      background: #fbfcff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 20px;
    }

    label {
      display: block;
      color: #344054;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfd6e4;
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
      color: var(--ink);
      background: #ffffff;
      min-height: 44px;
    }

    textarea {
      resize: vertical;
      min-height: 98px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 3px solid rgba(37, 99, 235, 0.18);
      border-color: var(--primary);
    }

    .full {
      grid-column: 1 / -1;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .chip input {
      width: auto;
      min-height: 0;
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 0 20px 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 18px;
      min-height: 46px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      color: #ffffff;
      background: var(--primary);
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      color: var(--primary);
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .results {
      padding: 20px;
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 18px;
    }

    .scorebox {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      background: #fbfdff;
    }

    .score {
      font-size: 54px;
      line-height: 1;
      font-weight: 900;
      color: var(--primary);
    }

    .decision {
      font-size: 22px;
      font-weight: 900;
      margin-top: 10px;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .result-list {
      margin: 0;
      padding-left: 20px;
    }

    .result-list li {
      margin: 7px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 10px;
      vertical-align: top;
      text-align: left;
    }

    th {
      background: #f8fafc;
      color: #344054;
    }

    .table-wrap {
      padding: 20px;
      overflow-x: auto;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .badge {
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 800;
      background: #eef2ff;
      color: #3730a3;
    }

    .badge.green {
      background: #ecfdf3;
      color: var(--green);
    }

    .badge.amber {
      background: #fffbeb;
      color: var(--amber);
    }

    .badge.red {
      background: #fef3f2;
      color: var(--red);
    }

    .notice {
      color: var(--muted);
      font-size: 13px;
      padding: 16px 20px 0;
    }

    footer {
      color: var(--muted);
      font-size: 13px;
      margin-top: 18px;
      text-align: center;
    }

    @media (max-width: 820px) {
      header,
      .grid,
      .results {
        grid-template-columns: 1fr;
      }

      .fram-map {
        grid-template-columns: repeat(2, 1fr);
      }

      main {
        width: min(100% - 20px, 1120px);
        padding-top: 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>護理 FRAM × AI 情境設計模型</h1>
        <div class="version">NURSING FRAM AI SCENARIO DESIGNER v1.0</div>
      </div>
      <div class="fram-map" aria-label="FRAM functional map">
        <div class="node">Input<br>輸入</div>
        <div class="node">Control<br>控制</div>
        <div class="node">Time<br>時間</div>
        <div class="node">Resource<br>資源</div>
        <div class="node core">Function<br>護理功能</div>
        <div class="node">Output<br>輸出</div>
      </div>
    </header>

    <section>
      <h2 class="section-title">基本研究邊界</h2>
      <div class="grid">
        <div>
          <label for="setting">臨床場域</label>
          <select id="setting">
            <option>內科病房</option>
            <option>急診</option>
            <option>加護病房 ICU</option>
            <option>手術室</option>
            <option>長照機構</option>
            <option>居家護理</option>
          </select>
        </div>
        <div>
          <label for="workflow">護理工作流程</label>
          <select id="workflow">
            <option>交班與接班</option>
            <option>給藥安全</option>
            <option>跌倒風險評估</option>
            <option>敗血症早期辨識</option>
            <option>出院衛教</option>
            <option>警示與異常回應</option>
          </select>
        </div>
        <div>
          <label for="patient">病人族群</label>
          <input id="patient" value="住院成人病人，含病情穩定與需觀察者">
        </div>
        <div>
          <label for="endpoint">流程終點</label>
          <input id="endpoint" value="形成下一班照護優先順序">
        </div>
        <div class="full">
          <label for="scope">排除範圍</label>
          <input id="scope" value="醫師查房決策、藥局調劑流程、跨院轉診流程">
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-title">進階 FRAM 與 AI 參數</h2>
      <div class="grid">
        <div>
          <label for="aiRole">AI 角色</label>
          <select id="aiRole">
            <option>摘要與待確認清單</option>
            <option>風險預測與優先排序</option>
            <option>異常趨勢監測</option>
            <option>衛教內容個人化</option>
            <option>紀錄輔助與缺漏提醒</option>
          </select>
        </div>
        <div>
          <label for="workload">工作負荷</label>
          <select id="workload">
            <option value="1">低</option>
            <option value="2" selected>中</option>
            <option value="3">高</option>
          </select>
        </div>
        <div>
          <label for="dataQuality">資料品質</label>
          <select id="dataQuality">
            <option value="3">完整且即時</option>
            <option value="2" selected>部分延遲或分散</option>
            <option value="1">缺漏且需人工補查</option>
          </select>
        </div>
        <div>
          <label for="governance">人員覆核機制</label>
          <select id="governance">
            <option value="3" selected>護理師逐項確認後採用</option>
            <option value="2">僅高風險項目需確認</option>
            <option value="1">系統自動帶入，人工事後修正</option>
          </select>
        </div>
        <div class="full">
          <label>主要變異來源</label>
          <div class="chips" id="variability">
            <label class="chip"><input type="checkbox" value="資訊分散" checked>資訊分散</label>
            <label class="chip"><input type="checkbox" value="時間壓力" checked>時間壓力</label>
            <label class="chip"><input type="checkbox" value="中斷頻繁" checked>中斷頻繁</label>
            <label class="chip"><input type="checkbox" value="病況快速變化">病況快速變化</label>
            <label class="chip"><input type="checkbox" value="警示疲乏">警示疲乏</label>
            <label class="chip"><input type="checkbox" value="跨專業溝通落差">跨專業溝通落差</label>
          </div>
        </div>
        <div class="full">
          <label
