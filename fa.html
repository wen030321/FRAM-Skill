<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>護理 FRAM × AI 情境設計模型</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d8dee9;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --amber: #b45309;
      --red: #b42318;
      --green: #047857;
      --shadow: 0 14px 30px rgba(31, 41, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background:
        linear-gradient(180deg, rgba(37, 99, 235, 0.08), transparent 320px),
        var(--bg);
      color: var(--ink);
      line-height: 1.6;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    header {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 24px;
      align-items: end;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .version {
      margin-top: 10px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 14px;
    }

    .fram-map {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(3, minmax(88px, 1fr));
      grid-template-rows: repeat(3, minmax(58px, auto));
      gap: 8px;
      min-height: 214px;
    }

    .node {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #fbfdff;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
    }

    .node.core {
      background: #e0f2fe;
      border-color: #93c5fd;
      color: #1e3a8a;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.22);
    }

    .node.time {
      grid-column: 2;
